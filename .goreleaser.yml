version: 2

# Release builds go to dist/release, so --clean leaves the preflight page's dist/site alone.
dist: dist/release

before:
  hooks:
    - go test ./...
    # The licences of everything compiled or embedded into the binary, shipped in every archive.
    - mise run licenses

builds:
  - id: canned-schedules-linux
    main: ./cmd/canned-schedules
    binary: canned-schedules
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"  # ARMv7
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: canned-schedules-darwin
    main: ./cmd/canned-schedules
    binary: canned-schedules
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: canned-schedules-windows
    main: ./cmd/canned-schedules
    binary: canned-schedules
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: unix-archives
    ids:
      - canned-schedules-linux
      - canned-schedules-darwin
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if and (eq .Os "darwin") (eq .Arch "all") -}}
      universal2
      {{- else if eq .Arch "amd64" -}}
      x86_64
      {{- else if eq .Arch "386" -}}
      i386
      {{- else -}}
      {{ .Arch }}
      {{- end -}}
      {{- if eq .Arch "arm" }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE.md
      - THIRD_PARTY_LICENSES.md

  - id: windows-archives
    ids:
      - canned-schedules-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - README.md
      - LICENSE.md
      - THIRD_PARTY_LICENSES.md

universal_binaries:
  - id: canned-schedules-darwin
    ids:
      - canned-schedules-darwin
    replace: true

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# Every archive and checksums.txt get a detached GPG signature (<file>.sig). The key comes from the release workflow
# (GPG_FINGERPRINT); mise run release:snapshot skips signing.
signs:
  - id: archives
    cmd: gpg
    args: ["--batch", "--local-user", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign",
           "${artifact}"]
    artifacts: archive
    output: true
  - id: checksums
    cmd: gpg
    args: ["--batch", "--local-user", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign",
           "${artifact}"]
    artifacts: checksum
    output: true

# Created as a draft: the release workflow publishes it only after every native binary passed its smoke test.
release:
  prerelease: auto
  draft: true
  replace_existing_draft: true
  mode: replace
  header: |
    ## canned-schedules {{ .Tag }} ({{ .Date }})

    Weekly capacity schedules from human-friendly Markdown - validate, preview and export.
  footer: |
    **Full Changelog**: https://github.com/iilei/canned-schedules/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    ### Binary Download
    Download the archive for your platform from the assets below. Each archive has a detached GPG signature
    (`.sig`) and a SHA-256 sidecar (`.sha256`); `checksums.txt` lists all of them and is signed too:

    ```bash
    gpg --verify checksums.txt.sig checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```

    ### Using Go
    ```bash
    go install github.com/iilei/canned-schedules/cmd/canned-schedules@{{ .Tag }}
    ```
