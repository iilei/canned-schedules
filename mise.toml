[tools]
# Keep the linter before Go so an older copy in Go's bin directory cannot shadow it.
golangci-lint = "2.14.0"
go = "1.25.14"
# Runs the test suites compiled to WebAssembly (test:wasm), like the browser page does.
node = "22.22.2"
# Builds, signs and publishes releases (.goreleaser.yml); CI uses the same version.
goreleaser = "2.18.3"
# SBOMs for the release archives (goreleaser's sboms step).
syft = "1.54.1"

[tasks.fmt]
description = "Format Go code using the configured golangci-lint formatters"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Check Go formatting without changing files"
run = "golangci-lint fmt --diff"

[tasks.vet]
description = "Run Go vet on all packages"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint with .golangci.yml"
run = "golangci-lint run"

[tasks.test]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Run tests and report coverage"
run = [
  "mkdir -p coverage",
  "go test -race -coverpkg=./... -coverprofile=coverage/coverage.out ./...",
  "go tool cover -func=coverage/coverage.out",
]

[tasks.build]
description = "Compile all packages, including the CLI"
run = "go build ./..."

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all non-mutating quality checks"
depends = ["fmt:check", "vet", "lint", "test", "build"]

[tasks.licenses]
description = "Write THIRD_PARTY_LICENSES.md: the licences of everything compiled or embedded into the binary"
# Raw block: mise renders task scripts as templates, and go list's format uses the same braces.
run = '''
{% raw %}
set -eu
out=THIRD_PARTY_LICENSES.md
fence() { printf '\n```text\n'; cat "$1"; printf '```\n'; }
{
  printf '# Third-party licences\n\nThe canned-schedules binary contains the following Go modules, the Go standard library and the\n'
  printf 'fonts embedded for the Sphinx kit. Their licences follow. canned-schedules itself is licensed under LICENSE.md.\n'
  go list -deps -f '{{if not .Standard}}{{with .Module}}{{if .Version}}{{.Path}} {{.Version}} {{.Dir}}{{end}}{{end}}{{end}}' \
    ./cmd/canned-schedules | sort -u |
  while read -r path version dir; do
    lic=$(ls "$dir" | grep -i -m1 -E '^(licen[cs]e|copying)') || { echo "no licence file in $dir" >&2; exit 1; }
    printf '\n## %s %s\n' "$path" "$version"
    fence "$dir/$lic"
  done
  printf '\n## Go standard library (%s)\n' "$(go env GOVERSION)"
  fence "$(go env GOROOT)/LICENSE"
  printf '\n## Ubuntu and Ubuntu Mono fonts (Ubuntu Font Licence)\n'
  fence assets/fonts/UFL.txt
  printf '\n## Schedule Braille Mono font (SIL Open Font License, a subset of Cascadia Mono)\n'
  fence assets/fonts/OFL-schedule-braille-mono.txt
} > "$out"
echo "wrote $out"
{% endraw %}
'''

[tasks."release:snapshot"]
description = "Build the release archives locally (no signing, no publishing) into dist/release"
run = "goreleaser release --snapshot --clean --skip=sign,publish"

[tasks."release:smoke"]
description = "Check one release archive against checksums.txt, unpack it and run the binary (the release smoke test)"
usage = '''
arg "<archive>" help="Archive name suffix, e.g. linux_x86_64.tar.gz or windows_amd64.zip"
flag "--dir <dir>" default="dist/release" help="Directory with the archives and checksums.txt"
'''
# Git Bash on the Windows runners; mise would use cmd there otherwise.
shell = "bash -c"
run = '''
set -eu
root=$(pwd)
cd "$usage_dir"
file=$(ls -- *_"$usage_archive")
sum=$(command -v sha256sum || echo "shasum -a 256")
grep -F "  $file" checksums.txt | $sum --check -
bin=$(mktemp -d)
trap 'rm -rf "$bin"' EXIT
case "$file" in
  *.zip) unzip -q "$file" -d "$bin" ;;
  *) tar -xzf "$file" -C "$bin" ;;
esac
test -f "$bin/LICENSE.md"
test -f "$bin/THIRD_PARTY_LICENSES.md"
exe=$bin/canned-schedules
if [ -f "$bin/canned-schedules.exe" ]; then exe=$bin/canned-schedules.exe; fi
"$exe" --version
"$exe" --help > /dev/null
"$exe" "$root/.gitlab/issue_templates/canned_schedule_request.md" | grep -q '"schema-version": "1"'
echo "smoke test passed: $file"
'''

[tasks."release:verify"]
description = "Verify a downloaded release: GPG signatures (key in release-key.asc), checksums and .sha256 sidecars"
usage = '''
arg "<dir>" help="Directory with the downloaded release files (gh release download <tag>)"
'''
run = '''
set -eu
key=$(pwd)/release-key.asc
fpr=B645234C9CB8175ECA5D78A5C8447A2252E9E7B6
cd "$usage_dir"
# A throwaway keyring with only the release key, so no other key of the user's can satisfy a signature.
GNUPGHOME=$(mktemp -d)
export GNUPGHOME
trap 'rm -rf "$GNUPGHOME"' EXIT
gpg --batch --quiet --import "$key"
verify() {
  gpg --batch --status-fd 1 --verify "$1.sig" "$1" 2>/dev/null | grep -q "^\[GNUPG:\] VALIDSIG .* $fpr\$" || {
    echo "BAD signature: $1" >&2
    exit 1
  }
}
verify checksums.txt
sum=$(command -v sha256sum || echo "shasum -a 256")
$sum --check --ignore-missing checksums.txt
for f in *.tar.gz *.zip; do
  [ -e "$f" ] || continue
  verify "$f"
  if [ -f "$f.sha256" ] && [ "$(cut -c1-64 "$f.sha256")" != "$($sum "$f" | cut -c1-64)" ]; then
    echo "BAD sidecar: $f.sha256" >&2
    exit 1
  fi
done
echo "release verified: signed by $fpr, checksums and sidecars match"
'''

[tasks."golden:check"]
description = "Regenerate testdata/golden from gen.py and fail if anything changed or appeared"
run = '''
set -eu
python3 testdata/golden/gen.py
if [ -n "$(git status --porcelain -- testdata/golden)" ]; then
  git status --short -- testdata/golden
  echo "testdata/golden differs from gen.py; run python3 testdata/golden/gen.py and commit the result" >&2
  exit 1
fi
'''

[tasks.docs]
description = "Regenerate the README's generated sections (flag tables, diagnostic codes) from the code"
run = "UPDATE_DOCS=1 go test ./internal/cli -run TestReadmeReference -count=1"

[tasks."web:build"]
description = "Build the browser preflight page (WebAssembly) into dist/site"
run = '''
set -eu
out=dist/site
rm -rf "$out"
mkdir -p "$out"
cp -R web/. "$out/"
cp -R assets/fonts "$out/fonts"
# The editor (CodeMirror 6) is bundled from editor/ with the versions locked in editor/package-lock.json.
npm ci --prefix editor --silent
node editor/build.mjs "$out"
# web/style.css stays readable in the repo; the page gets it minified by the same esbuild.
editor/node_modules/.bin/esbuild web/style.css --minify --log-level=warning --outfile="$out/style.css" --allow-overwrite
GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o "$out/app.wasm" ./cmd/canned-schedules-wasm
cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$out/"
# The "office hours" preset is the issue template itself, so the two never drift apart.
cp .gitlab/issue_templates/canned_schedule_request.md "$out/presets/office-hours.md"
git describe --always --dirty > "$out/version.txt" 2>/dev/null || true
echo "built $out ($(du -sh "$out" | cut -f1))"
'''

[tasks."web:serve"]
description = "Build and serve the preflight page on http://127.0.0.1:<port> (default 8080)"
depends = ["web:build"]
usage = '''
flag "-p --port <port>" env="PORT" default="8080" help="Port to listen on (localhost only)"
'''
# Bind to localhost: http.server listens on every interface by default, which would expose the page to the network.
run = 'python3 -m http.server --bind 127.0.0.1 --directory dist/site "$usage_port"'

[tasks."fonts:braille"]
description = "Rebuild assets/fonts/schedule-braille-mono.woff2 (the ASCII tab's font) from the pinned Cascadia release"
# fontTools and brotli are pinned: with them, the script reproduces the committed font byte for byte.
run = '''
set -eu
venv="$(mktemp -d)"
trap 'rm -rf "$venv"' EXIT
python3 -m venv "$venv"
"$venv/bin/pip" install --quiet --disable-pip-version-check 'fonttools==4.55.3' 'brotli==1.2.0'
"$venv/bin/python" -I assets/build-schedule-braille-mono.py
'''

[tasks."test:wasm"]
description = "Run the test suites compiled to WebAssembly under Node: the same code the browser page runs"
run = '''
set -eu
wasm="$(go env GOROOT)/lib/wasm"
# Go's WebAssembly runner caps command line plus environment at a few KB, so run with a minimal environment.
env -i HOME="$HOME" \
  PATH="$wasm:$(dirname "$(command -v go)"):$(dirname "$(command -v node)"):/usr/bin:/bin" \
  GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOOS=js GOARCH=wasm \
  go test -exec="$wasm/go_js_wasm_exec" ./internal/... ./schema/
'''

[tasks."example:test"]
description = "Test examples/consumer: its tasks in a throwaway git repo, with the binary built from this checkout"
run = "sh examples/test-consumer.sh"
