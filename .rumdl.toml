# Enable MD060 globally or via per-file-ignores/extend-enable
[global]
# Golden inputs are malformed on purpose.
exclude = ["testdata/golden/*/*/input.md"]
extend-enable = [
  "MD060",
  "MD001",  # Heading increment
  "MD003",  # Heading style
  "MD022",  # Blanks around headings
  "MD025",  # Single title
  "MD032",  # Blanks around lists
]

[MD013]
line-length = 227

# Configure MD060 options
[MD060]
enabled = true
style = "aligned"
column-align = "auto"

# Schedule documents (issue templates, page presets) put directive blocks right after each other (MD028) and lists right under the marker line
# (MD032); the parser accepts both. On GitHub, rumdl counts the template's frontmatter title as a second H1 (MD025).
[per-file-ignores]
".github/ISSUE_TEMPLATE/canned_schedule_request.md" = ["MD025", "MD028", "MD032"]
".gitlab/issue_templates/*.md" = ["MD028", "MD032"]
"web/presets/*.md" = ["MD028", "MD032"]
"**/*.canned-schedule.md" = ["MD028", "MD032"]
"examples/consumer/.github/ISSUE_TEMPLATE/canned_schedule_request.md" = ["MD025", "MD028", "MD032"]
