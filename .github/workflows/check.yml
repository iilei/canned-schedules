name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml (Go, golangci-lint, Node) and caches them. Every step below is a mise
      # task, so each failure reproduces locally with the same command.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # The golden fixtures are the spec and come from testdata/golden/gen.py (standard library only), so they can't
      # drift from their generator.
      - run: mise run golden:check

      # fmt:check, vet, lint, test (race detector) and build.
      - run: mise run check

      # Coverage of every package (-coverpkg=./...) into coverage/coverage.out, uploaded to Codecov for the README
      # badge. Pull requests from forks get no secrets; Codecov accepts those uploads without a token for public repos.
      - run: mise run coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.out
          disable_search: true
          fail_ci_if_error: true

      # The same test suites compiled to WebAssembly and run under Node: the browser page must give the same results
      # as the CLI.
      - run: mise run test:wasm

      # The preflight page builds (WebAssembly, static files).
      - run: mise run web:build

      # The consumer example (examples/consumer): its tasks against a copy of the issue template, with the binary
      # built from this commit.
      - run: mise run example:test

  # Builds and tests on the three common systems, so OS-specific behaviour (paths shown as ~/..., separators, atomic
  # file writes) is checked where it runs. Release binaries are cross-compiled by goreleaser either way.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Go: linting and the WebAssembly suites run in the check job above.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go

      - run: go build ./...

      - run: go test ./...

