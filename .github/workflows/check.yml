name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The golden fixtures are the spec and come from testdata/golden/gen.py (standard library only). Regenerate
      # them and fail if anything changed or appeared, so fixtures can't drift from their generator.
      - name: Golden fixtures match gen.py
        run: |
          python3 testdata/golden/gen.py
          if [ -n "$(git status --porcelain -- testdata/golden)" ]; then
            git status --short -- testdata/golden
            echo "::error::testdata/golden differs from gen.py; run python3 testdata/golden/gen.py and commit the result"
            exit 1
          fi

      # Installs the tools pinned in mise.toml (Go, golangci-lint, Node) and caches them.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # fmt:check, vet, lint, test (race detector) and build.
      - run: mise run check

      # The same test suites compiled to WebAssembly and run under Node: the browser page must give the same results
      # as the CLI.
      - run: mise run test:wasm

      # The preflight page builds (WebAssembly, static files).
      - run: mise run web:build

  # Builds and tests on the three common systems, so OS-specific behaviour (paths shown as ~/..., separators, atomic
  # file writes) is checked where it runs. Release binaries are cross-compiled by goreleaser either way.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Go: linting and the WebAssembly suites run in the check job above.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go

      - run: go build ./...

      - run: go test ./...

