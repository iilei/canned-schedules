name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # api:diff compares with the last release tag.
          persist-credentials: false

      # Installs the tools pinned in mise.toml (Go, golangci-lint, Node) and caches them. Every step below is a mise
      # task, so each failure reproduces locally with the same command.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19 # mise itself; pinned, see CLAUDE.md ("Dependabot")

      # The golden fixtures are the spec and come from testdata/golden/gen.py (standard library only), so they can't
      # drift from their generator.
      - run: mise run golden:check

      # fmt:check, vet, lint, test (race detector) and build.
      - run: mise run check

      # The Go library's API changes since the last release, in the job summary. Informational: before 1.0 a break is
      # allowed with a new minor version, and the release workflow enforces that (api:diff --release).
      - name: API changes since the last release
        run: |
          { echo '```text'; mise run -q api:diff; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # Coverage of every package (-coverpkg=./...) into coverage/coverage.out, uploaded to Codecov for the README
      # badge. Pull requests from forks get no secrets; Codecov accepts those uploads without a token for public repos.
      # Dependabot's pull requests skip both steps: their runs get no Actions secrets, and Codecov refuses the upload
      # without a token ("Token required because branch is protected"). Asks for the author, not the actor, so a
      # re-run or rebase by a maintainer behaves the same.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: mise run coverage

      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.out
          disable_search: true
          fail_ci_if_error: true

      # The same test suites compiled to WebAssembly and run under Node: the browser page must give the same results
      # as the CLI.
      - run: mise run test:wasm

      # The preflight page builds (WebAssembly, static files).
      - run: mise run web:build

      # The consumer example (examples/consumer): its tasks against a copy of the issue template, with the binary
      # built from this commit.
      - run: mise run example:test

  # Builds and tests on the three common systems, so OS-specific behaviour (paths shown as ~/..., separators, atomic
  # file writes) is checked where it runs. Release binaries are cross-compiled by goreleaser either way.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Go: linting and the WebAssembly suites run in the check job above.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19 # mise itself; pinned, see CLAUDE.md ("Dependabot")
          install_args: go

      - run: go build ./...

      - run: go test ./...

  # Every release archive, cross-compiled as the release would (no signing, no publishing): a dependency update merges
  # without a human, so it has to prove that all release targets still build.
  binaries:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the tags for the version.
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19 # mise itself; pinned, see CLAUDE.md ("Dependabot")

      - run: mise run release:snapshot

  # Merges Dependabot's pull requests once everything above is green. "needs" is the gate: binaries isn't a required
  # check in the ruleset, so auto-merge is only switched on after it passed. Rebase is the only merge method allowed.
  automerge:
    needs: [check, test, binaries]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # Merges the pull request.
      pull-requests: write # Switches auto-merge on.
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"

