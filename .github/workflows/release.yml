name: release

# Builds, signs and publishes a release for every v* tag:
#   build   goreleaser cross-compiles, GPG-signs every archive and checksums.txt, and creates the release as a draft.
#   smoke   each native binary is checked against checksums.txt and run on a matching runner (armv7 has no runner).
#   publish adds a .sha256 sidecar per archive and publishes the draft, only after every smoke test passed.
# Secrets: GPG_PRIVATE_KEY (ASCII-armoured private key) and GPG_PASSPHRASE.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Creates the draft release and uploads its assets.
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the tags for the version and the changelog.
          persist-credentials: false

      # Installs the tools pinned in mise.toml, goreleaser included.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      # The exact files that went into the draft, for the smoke tests and the sidecars.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/checksums.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, archive: linux_x86_64.tar.gz }
          - { runner: ubuntu-24.04-arm, archive: linux_arm64.tar.gz }
          - { runner: macos-latest, archive: darwin_universal2.tar.gz }
          - { runner: windows-latest, archive: windows_amd64.zip }
          - { runner: windows-11-arm, archive: windows_arm64.zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify, unpack and run
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          cd release
          file=$(ls -- *_"$ARCHIVE")
          sum=$(command -v sha256sum || echo "shasum -a 256")
          grep -F "  $file" checksums.txt | $sum --check -
          mkdir bin
          case "$file" in
            *.zip) unzip -q "$file" -d bin ;;
            *) tar -xzf "$file" -C bin ;;
          esac
          test -f bin/LICENSE.md
          test -f bin/THIRD_PARTY_LICENSES.md
          exe=bin/canned-schedules
          if [ -f bin/canned-schedules.exe ]; then exe=bin/canned-schedules.exe; fi
          "$exe" --version
          "$exe" --help > /dev/null
          "$exe" ../.gitlab/issue_templates/canned_schedule_request.md > out.json
          grep -q '"schema-version": "1"' out.json

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Uploads the sidecars and publishes the draft.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: SHA-256 sidecars and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          for f in *.tar.gz *.zip; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          gh release upload "$TAG" ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          # Pre-releases (v1.2.0-rc.1) are published but never marked as the latest release.
          latest=true
          case "$TAG" in *-*) latest=false ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
