name: release

# Builds, signs and publishes a release for every v* tag:
#   build   goreleaser cross-compiles, writes an SBOM per archive, GPG-signs every archive and checksums.txt, and
#           creates the release as a draft; every file in checksums.txt gets a build provenance attestation.
#   smoke   each binary is checked against checksums.txt and run on a matching runner (armv7 under qemu).
#   publish checks the attestations, adds a .sha256 sidecar per archive and publishes the draft, only after every
#           smoke test passed.
# Secrets (environment "release", v* tags only): GPG_PRIVATE_KEY (ASCII-armoured private key) and GPG_PASSPHRASE.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The GPG secrets live in this environment, which only v* tags may deploy to.
    environment: release
    permissions:
      contents: write # Creates the draft release and uploads its assets.
      id-token: write # Signs the provenance attestation (Sigstore).
      attestations: write # Stores it.
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the tags for the version and the changelog.
          persist-credentials: false

      # Installs the tools pinned in mise.toml, goreleaser included.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19 # mise itself; pinned, see CLAUDE.md ("Dependabot")

      - id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Fail fast (before the multi-minute build) if the key cannot sign,
      # e.g. because the key or its signing subkey has expired.
      - name: Verify GPG key can sign
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          gpg --list-secret-keys --list-options show-unusable-subkeys "$GPG_FINGERPRINT"
          if ! echo "preflight" | gpg --batch --local-user "$GPG_FINGERPRINT" --detach-sign --output /dev/null; then
            echo "::error::GPG key $GPG_FINGERPRINT cannot sign (expired/revoked key or subkey?). Extend its expiry and update the GPG_PRIVATE_KEY secret."
            exit 1
          fi

      # goreleaser creates the release as a draft, and only the publish job, after every smoke test, publishes it. A
      # release that is already published (the Releases page tags and publishes in one step) would bypass the smoke
      # tests, so the build stops. The tags endpoint finds published releases only; a draft gives 404 and passes.
      - name: Refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .html_url 2>&1); then
            echo "::error::$TAG is already published ($url). Release by pushing a signed tag (git tag -s), not on the Releases page."
            exit 1
          elif ! printf '%s' "$url" | grep -q 'HTTP 404'; then
            echo "$url" >&2
            exit 1
          fi

      # Fails before any draft exists when the Go library's API broke but the tag doesn't raise the minor version
      # (before 1.0) or the major version.
      - run: mise run api:diff --release "$GITHUB_REF_NAME"

      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      # Provenance for every file checksums.txt lists (archives and SBOMs): gh attestation verify checks it, and mise's
      # github: backend does so on install.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt

      # The exact files that went into the draft, for the smoke tests and the sidecars.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/checksums.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, archive: linux_x86_64.tar.gz }
          - { runner: ubuntu-26.04-arm, archive: linux_arm64.tar.gz }
          - { runner: macos-26, archive: darwin_universal2.tar.gz }
          - { runner: windows-2025, archive: windows_amd64.zip }
          - { runner: windows-11-arm, archive: windows_arm64.zip }
          # No armv7 runner: the static binary runs under qemu's user-mode emulation (binfmt) on x86_64.
          - { runner: ubuntu-26.04, archive: linux_armv7.tar.gz, qemu: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - if: matrix.qemu
        run: |
          sudo apt-get update -qq
          # qemu-user-binfmt registers qemu-user with binfmt_misc (and pulls it in). Ubuntu 26.04 has
          # qemu-user-static only as a virtual package, which apt-get install refuses.
          sudo apt-get install -y -qq qemu-user-binfmt

      # mise only, no tools: the smoke test needs none, and five runners would otherwise install Go and Node.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19 # mise itself; pinned, see CLAUDE.md ("Dependabot")
          install: false

      # The same task runs locally on the archives from mise run release:snapshot.
      - run: mise run release:smoke "$ARCHIVE" --dir release
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  publish:
    needs: smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # Uploads the sidecars and publishes the draft.
      attestations: read # gh attestation verify.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The attestations from the build job must verify for every archive before anything is published.
      - name: Verify the provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in release/*.tar.gz release/*.zip; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "attestation verified: $f"
          done

      - name: SHA-256 sidecars and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          for f in *.tar.gz *.zip; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          gh release upload "$TAG" ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          # Pre-releases (v1.2.0-rc.1) are published but never marked as the latest release.
          latest=true
          case "$TAG" in *-*) latest=false ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
